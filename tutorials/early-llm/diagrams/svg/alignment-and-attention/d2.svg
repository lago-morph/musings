<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="A soft alignment matrix for a French-to-English translation: source words on the columns, target words on the rows, each cell shaded by its learned alignment weight, the dark near-diagonal cells showing which source word each target word draws from.">
  <title>Soft alignment matrix — the learned attention weights</title>
  <desc>A grid with French source words on the columns and English target words on the rows. Each cell is shaded by the attention weight alpha; darker means stronger alignment. Each row sums to one. Most weight lies on a near-diagonal path, with one off-diagonal cell showing a reordering, exactly the soft analogue of an IBM-model or HMM word-alignment matrix estimated by EM.</desc>
  <style>
    .board { fill: #FDFCF8; }
    text { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink   { stroke: #222222; }
    .muted { stroke: #8A8A85; }
    .grid  { fill: none; stroke: #8A8A85; stroke-width: 1; }
    .cell  { stroke: #8A8A85; stroke-width: 0.75; }
    .lbl   { font-size: 19px; }
    .src   { font-size: 17px; fill: #2F6FED; text-anchor: middle; }
    .tgt   { font-size: 17px; fill: #2E9E5B; text-anchor: end; }
    .note  { font-size: 13px; fill: #8A8A85; }
    .tag   { font-size: 14px; fill: #8A8A85; text-anchor: middle; }
    .title { font-size: 15px; fill: #8A8A85; }
  </style>
  <rect class="board" x="0" y="0" width="760" height="600"/>

  <text class="title" x="24" y="30">soft alignment matrix — α_ij, learned end to end</text>

  <!-- column header: source (French) -->
  <text class="tag" x="430" y="70">source words j  (French)</text>
  <text class="src" x="300" y="104">L'</text>
  <text class="src" x="375" y="104">accord</text>
  <text class="src" x="450" y="104">sur</text>
  <text class="src" x="525" y="104">la</text>
  <text class="src" x="600" y="104">zone</text>

  <!-- row header: target (English) -->
  <text class="tag" x="120" y="150" transform="rotate(-90 120 320)">target words i  (English)</text>

  <!-- grid: 5 cols x 5 rows, origin x=262 y=120, cell 75x75 -->
  <!-- shaded cells: darker = larger alpha. Fill grey with opacity ~ weight. -->
  <!-- row 1: The -> L' (strong) -->
  <rect class="cell" x="262" y="120" width="75" height="75" fill="#222222" fill-opacity="0.80"/>
  <rect class="cell" x="337" y="120" width="75" height="75" fill="#222222" fill-opacity="0.06"/>
  <rect class="cell" x="412" y="120" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <rect class="cell" x="487" y="120" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <rect class="cell" x="562" y="120" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <text class="tgt" x="250" y="164">The</text>

  <!-- row 2: agreement -> accord (strong) -->
  <rect class="cell" x="262" y="195" width="75" height="75" fill="#222222" fill-opacity="0.05"/>
  <rect class="cell" x="337" y="195" width="75" height="75" fill="#222222" fill-opacity="0.82"/>
  <rect class="cell" x="412" y="195" width="75" height="75" fill="#222222" fill-opacity="0.06"/>
  <rect class="cell" x="487" y="195" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <rect class="cell" x="562" y="195" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <text class="tgt" x="250" y="239">agreement</text>

  <!-- row 3: on -> sur (strong) -->
  <rect class="cell" x="262" y="270" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <rect class="cell" x="337" y="270" width="75" height="75" fill="#222222" fill-opacity="0.07"/>
  <rect class="cell" x="412" y="270" width="75" height="75" fill="#222222" fill-opacity="0.78"/>
  <rect class="cell" x="487" y="270" width="75" height="75" fill="#222222" fill-opacity="0.06"/>
  <rect class="cell" x="562" y="270" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <text class="tgt" x="250" y="314">on</text>

  <!-- row 4: the -> zone region: reordering — 'the' splits a little -->
  <rect class="cell" x="262" y="345" width="75" height="75" fill="#222222" fill-opacity="0.05"/>
  <rect class="cell" x="337" y="345" width="75" height="75" fill="#222222" fill-opacity="0.05"/>
  <rect class="cell" x="412" y="345" width="75" height="75" fill="#222222" fill-opacity="0.08"/>
  <rect class="cell" x="487" y="345" width="75" height="75" fill="#222222" fill-opacity="0.55"/>
  <rect class="cell" x="562" y="345" width="75" height="75" fill="#222222" fill-opacity="0.27"/>
  <text class="tgt" x="250" y="389">the</text>

  <!-- row 5: area -> zone (strong, off original order) -->
  <rect class="cell" x="262" y="420" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <rect class="cell" x="337" y="420" width="75" height="75" fill="#222222" fill-opacity="0.04"/>
  <rect class="cell" x="412" y="420" width="75" height="75" fill="#222222" fill-opacity="0.06"/>
  <rect class="cell" x="487" y="420" width="75" height="75" fill="#222222" fill-opacity="0.10"/>
  <rect class="cell" x="562" y="420" width="75" height="75" fill="#222222" fill-opacity="0.74"/>
  <text class="tgt" x="250" y="464">area</text>

  <!-- grid outline -->
  <rect class="grid" x="262" y="120" width="375" height="375"/>
  <line class="grid" x1="337" y1="120" x2="337" y2="495"/>
  <line class="grid" x1="412" y1="120" x2="412" y2="495"/>
  <line class="grid" x1="487" y1="120" x2="487" y2="495"/>
  <line class="grid" x1="562" y1="120" x2="562" y2="495"/>
  <line class="grid" x1="262" y1="195" x2="637" y2="195"/>
  <line class="grid" x1="262" y1="270" x2="637" y2="270"/>
  <line class="grid" x1="262" y1="345" x2="637" y2="345"/>
  <line class="grid" x1="262" y1="420" x2="637" y2="420"/>

  <!-- annotations -->
  <text class="note" x="262" y="528">darker cell = larger α_ij (stronger alignment)</text>
  <text class="note" x="262" y="548">each target row sums to 1 — a soft distribution over source words</text>
  <text class="note" x="262" y="568">cf. IBM-model / HMM word alignment, but learned by gradient descent, not EM</text>
</svg>
