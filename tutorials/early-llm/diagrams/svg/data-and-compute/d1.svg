<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="The corpora behind the first large language models shown on a scale bar from smallest to largest, with BooksCorpus, Wikipedia, WebText, and C4 labeled with their approximate sizes and the models that used them.">
  <title>Training corpora — scale bar from BooksCorpus to C4</title>
  <desc>A horizontal scale bar representing growing corpus size. Four datasets are marked left to right: BooksCorpus (approximately 800 million words, used by GPT-1 and BERT), English Wikipedia (approximately 2.5 billion words, used by BERT), WebText (approximately 40 GB, used by GPT-2, filtered from Reddit links), and C4 (approximately 750 GB after filtering, used by T5, derived from Common Crawl). An annotation above C4 notes that Common Crawl in its raw form is petabytes, filtered down to roughly 750 GB.</desc>
  <style>
    .board  { fill: #FDFCF8; }
    text    { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink    { stroke: #222222; }
    .blue   { stroke: #2F6FED; }
    .red    { stroke: #E5484D; }
    .green  { stroke: #2E9E5B; }
    .muted  { stroke: #8A8A85; }
    .box    { fill: #FDFCF8; stroke-width: 2; stroke-linejoin: round; }
    .flow   { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .lbl    { font-size: 18px; text-anchor: middle; }
    .sub    { font-size: 13px; text-anchor: middle; fill: #8A8A85; }
    .note   { font-size: 13px; fill: #8A8A85; }
    .notem  { font-size: 13px; fill: #8A8A85; text-anchor: middle; }
    .title  { font-size: 15px; fill: #8A8A85; }
    .blueT  { fill: #2F6FED; }
    .redT   { fill: #E5484D; }
    .greenT { fill: #2E9E5B; }
    .axis   { stroke: #222222; stroke-width: 2.5; fill: none; stroke-linecap: round; }
  </style>

  <rect class="board" x="0" y="0" width="1100" height="420"/>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#8A8A85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="title" x="30" y="30">training corpora — approximate scale</text>

  <!-- axis line -->
  <line class="axis" x1="80" y1="260" x2="1050" y2="260" marker-end="url(#ah)"/>
  <text style="font-size:14px; fill:#222222; text-anchor:start;" x="1056" y="265">size →</text>

  <!-- tick labels -->
  <text class="sub" x="80" y="282">smaller</text>
  <text class="sub" x="1040" y="282">larger</text>

  <!-- ── BooksCorpus ── -->
  <!-- dot on axis at x=180 -->
  <circle cx="180" cy="260" r="7" fill="#2F6FED" stroke="#2F6FED" stroke-width="1.5"/>
  <!-- leader line up -->
  <line class="flow muted" x1="180" y1="253" x2="180" y2="185" stroke-dasharray="4 3"/>
  <!-- box -->
  <rect class="box blue" x="100" y="120" width="160" height="64" rx="5" stroke-width="2"/>
  <text class="lbl blueT" x="180" y="148">BooksCorpus</text>
  <text class="sub" x="180" y="167">~800M words</text>
  <!-- source note -->
  <text class="notem" x="180" y="103">used by: GPT-1, BERT</text>
  <text class="notem" x="180" y="88">Zhu et al. 2015</text>

  <!-- ── Wikipedia ── -->
  <circle cx="360" cy="260" r="7" fill="#222222" stroke="#222222" stroke-width="1.5"/>
  <line class="flow muted" x1="360" y1="253" x2="360" y2="185" stroke-dasharray="4 3"/>
  <rect class="box ink" x="278" y="120" width="164" height="64" rx="5" stroke-width="2"/>
  <text class="lbl" x="360" y="148">Wikipedia (en)</text>
  <text class="sub" x="360" y="167">~2.5B words</text>
  <text class="notem" x="360" y="103">used by: BERT</text>
  <text class="notem" x="360" y="88">Devlin et al. 2019</text>

  <!-- ── WebText ── -->
  <circle cx="610" cy="260" r="7" fill="#2E9E5B" stroke="#2E9E5B" stroke-width="1.5"/>
  <line class="flow muted" x1="610" y1="253" x2="610" y2="185" stroke-dasharray="4 3"/>
  <rect class="box green" x="528" y="120" width="164" height="64" rx="5" stroke-width="2"/>
  <text class="lbl greenT" x="610" y="143">WebText</text>
  <text class="sub" x="610" y="161">~40 GB (~8B tokens)</text>
  <text class="notem" x="610" y="103">used by: GPT-2</text>
  <text class="notem" x="610" y="88">Radford et al. 2019</text>
  <!-- quality heuristic note -->
  <text class="note" x="528" y="200">Reddit links ≥3 karma</text>

  <!-- ── C4 ── -->
  <circle cx="900" cy="260" r="9" fill="#E5484D" stroke="#E5484D" stroke-width="1.5"/>
  <line class="flow muted" x1="900" y1="251" x2="900" y2="185" stroke-dasharray="4 3"/>
  <rect class="box red" x="818" y="120" width="164" height="64" rx="5" stroke-width="3"/>
  <text class="lbl redT" x="900" y="143">C4</text>
  <text class="sub" x="900" y="161">~750 GB (filtered)</text>
  <text class="notem" x="900" y="103">used by: T5</text>
  <text class="notem" x="900" y="88">Raffel et al. 2020</text>

  <!-- annotation: Common Crawl raw -->
  <text class="note" x="820" y="308">Common Crawl (raw):</text>
  <text class="note" x="820" y="324">petabytes → filtered to ~750 GB</text>
  <path class="flow muted" d="M900,295 L900,270" stroke-dasharray="3 3" marker-end="url(#ahm)"/>

  <!-- footnote -->
  <text class="note" x="80" y="390">Sizes are approximate; token counts depend on tokenizer. Attributes sourced to the primary papers listed in the bibliography.</text>
</svg>
