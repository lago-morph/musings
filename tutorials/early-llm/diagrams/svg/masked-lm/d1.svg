<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Encoder-only stack with bidirectional self-attention: a masked token is predicted from both left and right context, with [CLS] and [SEP] tokens shown.">
  <title>Masked LM — encoder-only stack with bidirectional self-attention</title>
  <desc>Input sequence starting with [CLS], containing a [MASK] token, and ending with [SEP] feeds through an embedding layer, then L encoder blocks each with full bidirectional self-attention and an FFN. The [MASK] position's final representation is projected through linear and softmax to predict the original token. The [CLS] vector is labeled as the aggregate representation used for classification.</desc>
  <style>
    .board { fill: #FDFCF8; }
    text { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink   { stroke: #222222; fill: none; }
    .blue  { stroke: #2F6FED; fill: none; }
    .green { stroke: #2E9E5B; fill: none; }
    .red   { stroke: #E5484D; fill: none; }
    .muted { stroke: #8A8A85; fill: none; }
    .boxfill { fill: #FDFCF8; }
    .flow  { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .lbl   { font-size: 18px; text-anchor: middle; }
    .lbls  { font-size: 14px; text-anchor: middle; }
    .dim   { font-size: 12px; text-anchor: middle; fill: #8A8A85; }
    .note  { font-size: 12px; fill: #8A8A85; }
    .notem { font-size: 12px; fill: #8A8A85; text-anchor: middle; }
    .title { font-size: 14px; fill: #8A8A85; }
    .blueT  { fill: #2F6FED; }
    .greenT { fill: #2E9E5B; }
    .redT   { fill: #E5484D; }
  </style>
  <rect class="board" x="0" y="0" width="980" height="520"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2F6FED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2E9E5B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#E5484D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#8A8A85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="title" x="24" y="24">masked LM — encoder-only bidirectional stack</text>

  <!-- ===== Input token sequence at the bottom ===== -->
  <!-- 5 token boxes: [CLS] the [MASK] sat [SEP] -->
  <!-- Centered around x=490, 5 boxes each 120 wide with 16 gap -->
  <!-- Positions: 90,228,366,504,642 (centers), y=468 center -->

  <!-- [CLS] -->
  <g transform="rotate(-0.3 90 468)">
    <rect class="boxfill blue" x="30" y="444" width="120" height="48" rx="4" stroke-width="2"/>
  </g>
  <text class="lbls blueT" x="90" y="474">[CLS]</text>

  <!-- the -->
  <g transform="rotate(0.2 228 468)">
    <rect class="boxfill ink" x="168" y="444" width="120" height="48" rx="4" stroke-width="1.6"/>
  </g>
  <text class="lbls" x="228" y="474">the</text>

  <!-- [MASK] — highlighted in red -->
  <g transform="rotate(-0.4 366 468)">
    <rect class="boxfill red" x="306" y="444" width="120" height="48" rx="4" stroke-width="2.5"/>
  </g>
  <text class="lbls redT" x="366" y="474">[MASK]</text>

  <!-- sat -->
  <g transform="rotate(0.3 504 468)">
    <rect class="boxfill ink" x="444" y="444" width="120" height="48" rx="4" stroke-width="1.6"/>
  </g>
  <text class="lbls" x="504" y="474">sat</text>

  <!-- [SEP] -->
  <g transform="rotate(-0.2 642 468)">
    <rect class="boxfill blue" x="582" y="444" width="120" height="48" rx="4" stroke-width="2"/>
  </g>
  <text class="lbls blueT" x="642" y="474">[SEP]</text>

  <!-- dim label below tokens -->
  <text class="dim" x="366" y="508">input sequence  (n = 5 tokens)</text>

  <!-- Arrows from each token upward to embed box -->
  <path class="flow ink" d="M90,444 L90,420" stroke-width="1.4" marker-end="url(#ah)"/>
  <path class="flow ink" d="M228,444 L228,420" stroke-width="1.4" marker-end="url(#ah)"/>
  <path class="flow red" d="M366,444 L366,420" stroke-width="1.4" marker-end="url(#ahr)"/>
  <path class="flow ink" d="M504,444 L504,420" stroke-width="1.4" marker-end="url(#ah)"/>
  <path class="flow ink" d="M642,444 L642,420" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Embed + pos enc bar -->
  <g transform="rotate(0.3 366 400)">
    <rect class="boxfill ink" x="30" y="382" width="672" height="40" rx="4" stroke-width="1.8"/>
  </g>
  <text class="lbl" x="366" y="408" font-size="15">embed + pos enc   →   X ∈ ℝⁿ ˣ ᵈmodel</text>

  <!-- Arrows up to encoder block -->
  <path class="flow ink" d="M90,382 L90,354" stroke-width="1.4" marker-end="url(#ah)"/>
  <path class="flow ink" d="M366,382 L366,354" stroke-width="1.4" marker-end="url(#ahr)"/>
  <path class="flow ink" d="M642,382 L642,354" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Encoder block -->
  <g transform="rotate(-0.3 366 260)">
    <rect class="boxfill blue" x="30" y="172" width="672" height="184" rx="6" stroke-width="2.5"/>
  </g>
  <text class="lbl blueT" x="366" y="202" font-size="16">encoder block × L</text>

  <!-- inner: bidirectional self-attention -->
  <g transform="rotate(0.2 250 240)">
    <rect class="boxfill blue" x="60" y="218" width="380" height="42" rx="4" stroke-width="1.6"/>
  </g>
  <text class="lbls blueT" x="250" y="245" font-size="13">bidirectional self-attention (all attend to all)</text>

  <!-- bidirectional arrows between a few tokens inside the block -->
  <!-- short horizontal double-headed arrows to indicate bidirectionality -->
  <line class="blue" x1="82" y1="278" x2="118" y2="278" stroke-width="1.4"/>
  <path d="M82,274 L74,278 L82,282" fill="none" stroke="#2F6FED" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M118,274 L126,278 L118,282" fill="none" stroke="#2F6FED" stroke-width="1.4" stroke-linecap="round"/>

  <line class="blue" x1="136" y1="278" x2="172" y2="278" stroke-width="1.4"/>
  <path d="M136,274 L128,278 L136,282" fill="none" stroke="#2F6FED" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M172,274 L180,278 L172,282" fill="none" stroke="#2F6FED" stroke-width="1.4" stroke-linecap="round"/>

  <line class="blue" x1="190" y1="278" x2="226" y2="278" stroke-width="1.4"/>
  <path d="M190,274 L182,278 L190,282" fill="none" stroke="#2F6FED" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M226,274 L234,278 L226,282" fill="none" stroke="#2F6FED" stroke-width="1.4" stroke-linecap="round"/>

  <text class="notem" x="250" y="296" font-size="11">⟷ every position connects to every other ⟷</text>

  <!-- inner: FFN -->
  <g transform="rotate(-0.2 540 240)">
    <rect class="boxfill ink" x="462" y="218" width="200" height="42" rx="4" stroke-width="1.6"/>
  </g>
  <text class="lbls" x="562" y="245" font-size="13">FFN</text>

  <!-- arrow between attention and FFN inside block -->
  <path class="flow ink" d="M440,239 L462,239" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- Ellipsis above block -->
  <text class="lbl" x="366" y="150" font-size="22">⋮</text>
  <text class="notem" x="366" y="168">L blocks total</text>

  <!-- Arrows from block output upward -->
  <path class="flow blue" d="M90,172 L90,130" stroke-width="1.4" marker-end="url(#ahb)"/>
  <path class="flow red" d="M366,172 L366,130" stroke-width="1.6" marker-end="url(#ahr)"/>
  <path class="flow blue" d="M642,172 L642,130" stroke-width="1.4" marker-end="url(#ahb)"/>

  <!-- [CLS] aggregate representation annotation (left side) -->
  <g transform="rotate(-0.3 90 104)">
    <rect class="boxfill blue" x="30" y="82" width="120" height="44" rx="4" stroke-width="2"/>
  </g>
  <text class="lbls blueT" x="90" y="104" font-size="13">[CLS] vector</text>
  <text class="notem blueT" x="90" y="120" font-size="11">aggregate repr.</text>

  <!-- annotation for CLS -->
  <path class="flow muted" d="M152,104 L220,104" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ahm)"/>
  <text class="note" x="228" y="100">used for sequence</text>
  <text class="note" x="228" y="114">classification tasks</text>

  <!-- [MASK] prediction path (center) -->
  <g transform="rotate(0.4 366 104)">
    <rect class="boxfill red" x="306" y="82" width="120" height="44" rx="4" stroke-width="2.5"/>
  </g>
  <text class="lbls redT" x="366" y="104" font-size="13">[MASK] output</text>
  <text class="notem redT" x="366" y="120" font-size="11">contextual vector</text>

  <!-- Arrow from [MASK] output up to linear+softmax -->
  <path class="flow red" d="M366,82 L366,60" stroke-width="1.6" marker-end="url(#ahr)"/>

  <!-- Linear + softmax box -->
  <g transform="rotate(-0.3 490 38)">
    <rect class="boxfill green" x="306" y="20" width="368" height="42" rx="4" stroke-width="2.5"/>
  </g>
  <text class="lbl greenT" x="490" y="47" font-size="15">linear + softmax  →  predicted token</text>

  <!-- dim label -->
  <text class="dim" x="490" y="76">distribution over V vocabulary tokens</text>

</svg>
