<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-label="Three heads, one sentence: each head imposes a different attention pattern over the same tokens.">
  <title>Different heads, different relations over the same sentence</title>
  <desc>The same sentence "the bank by the river raised its rates" is shown three times, one row per head. Head 1 links each word to its nearby neighbours. Head 2 draws an arc from the verb "raised" back to its subject "bank". Head 3 draws an arc from the pronoun "its" back to its antecedent "bank". The labels are an observed, post-hoc interpretation, not a guarantee.</desc>
  <style>
    .board { fill: #FDFCF8; }
    text { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink   { stroke: #222222; }
    .blue  { stroke: #2F6FED; }
    .red   { stroke: #E5484D; }
    .green { stroke: #2E9E5B; }
    .muted { stroke: #8A8A85; }
    .arc   { fill: none; stroke-linecap: round; }
    .tok   { font-size: 18px; text-anchor: middle; }
    .hd    { font-size: 15px; fill: #8A8A85; }
    .ann   { font-size: 13px; fill: #8A8A85; }
    .cap   { font-size: 14px; fill: #8A8A85; text-anchor: middle; font-style: italic; }
    .blueT  { fill: #2F6FED; }
    .redT   { fill: #E5484D; }
    .greenT { fill: #2E9E5B; }
  </style>
  <rect class="board" x="0" y="0" width="940" height="520"/>

  <!-- token x-positions, shared by all rows:
       the=170  bank=270  by=350  the=420  river=510  raised=620  its=720  rates=820 -->

  <!-- ============ ROW 1 : head 1 — local / nearby ============ -->
  <text class="hd" x="40" y="90">head 1</text>
  <text class="ann" x="40" y="108">attends locally</text>
  <text class="tok" x="170" y="120">the</text>
  <text class="tok" x="270" y="120">bank</text>
  <text class="tok" x="350" y="120">by</text>
  <text class="tok" x="420" y="120">the</text>
  <text class="tok" x="510" y="120">river</text>
  <text class="tok" x="620" y="120">raised</text>
  <text class="tok" x="720" y="120">its</text>
  <text class="tok" x="820" y="120">rates</text>
  <!-- neighbour arcs (above the words) -->
  <path class="arc blue" d="M180,108 C205,82 245,82 262,108"  stroke-width="2.4" opacity="0.7"/>
  <path class="arc blue" d="M280,108 C305,84 335,84 344,108"  stroke-width="2.4" opacity="0.7"/>
  <path class="arc blue" d="M360,108 C385,84 405,84 412,108"  stroke-width="2.4" opacity="0.7"/>
  <path class="arc blue" d="M432,108 C460,82 490,82 502,108"  stroke-width="2.4" opacity="0.7"/>
  <path class="arc blue" d="M524,108 C560,80 595,80 612,108"  stroke-width="2.4" opacity="0.7"/>
  <path class="arc blue" d="M632,108 C665,82 700,82 712,108"  stroke-width="2.4" opacity="0.7"/>
  <path class="arc blue" d="M730,108 C760,82 795,82 812,108"  stroke-width="2.4" opacity="0.7"/>

  <!-- ============ ROW 2 : head 2 — verb to subject (syntactic) ============ -->
  <text class="hd" x="40" y="250">head 2</text>
  <text class="ann" x="40" y="268">verb &#8594; its subject</text>
  <text class="ann" x="40" y="284">(syntactic)</text>
  <text class="tok" x="170" y="280">the</text>
  <text class="tok redT" x="270" y="280">bank</text>
  <text class="tok" x="350" y="280">by</text>
  <text class="tok" x="420" y="280">the</text>
  <text class="tok" x="510" y="280">river</text>
  <text class="tok blueT" x="620" y="280">raised</text>
  <text class="tok" x="720" y="280">its</text>
  <text class="tok" x="820" y="280">rates</text>
  <!-- arc from raised back to bank (above) -->
  <path class="arc red" d="M612,266 C520,196 360,196 274,266" stroke-width="3" opacity="0.85" marker-end="url(#ah2)"/>

  <!-- ============ ROW 3 : head 3 — pronoun to antecedent (coreference) ============ -->
  <text class="hd" x="40" y="410">head 3</text>
  <text class="ann" x="40" y="428">pronoun &#8594; antecedent</text>
  <text class="ann" x="40" y="444">(coreference-like)</text>
  <text class="tok" x="170" y="440">the</text>
  <text class="tok redT" x="270" y="440">bank</text>
  <text class="tok" x="350" y="440">by</text>
  <text class="tok" x="420" y="440">the</text>
  <text class="tok" x="510" y="440">river</text>
  <text class="tok" x="620" y="440">raised</text>
  <text class="tok blueT" x="720" y="440">its</text>
  <text class="tok" x="820" y="440">rates</text>
  <!-- arc from its back to bank (above) -->
  <path class="arc red" d="M712,426 C580,352 400,352 274,426" stroke-width="3" opacity="0.85" marker-end="url(#ah2)"/>

  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#E5484D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- separating guide lines (faint) -->
  <line class="muted" x1="40" y1="160" x2="900" y2="160" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5"/>
  <line class="muted" x1="40" y1="320" x2="900" y2="320" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5"/>

  <!-- caption -->
  <text class="cap" x="470" y="492">same tokens, three different relations &#8212; head roles are an observed, post-hoc reading, not guaranteed</text>
</svg>
