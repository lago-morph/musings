<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-label="Self-supervision: the corpus manufactures its own labels, so training scales on raw unlabeled text.">
  <title>Self-supervision: the text is its own label</title>
  <desc>Raw unlabeled text on the left. One sentence is split into a visible input part and a hidden part. The visible part feeds a model; the hidden part becomes the training target. The model's prediction is scored against that target by cross-entropy. A banner notes the text supplies its own supervision, so training scales on cheap unlabeled corpora with no annotation, unlike classic supervised learning where a human must label every example.</desc>
  <style>
    .board { fill: #FDFCF8; }
    text { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink   { stroke: #222222; }
    .blue  { stroke: #2F6FED; }
    .red   { stroke: #E5484D; }
    .green { stroke: #2E9E5B; }
    .muted { stroke: #8A8A85; }
    .box   { fill: #FDFCF8; stroke-width: 2; stroke-linejoin: round; }
    .flow  { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .h     { font-size: 18px; text-anchor: middle; }
    .s     { font-size: 14px; text-anchor: middle; }
    .note  { font-size: 13px; fill: #8A8A85; text-anchor: middle; }
    .title { font-size: 15px; fill: #8A8A85; }
    .blueT { fill: #2F6FED; } .redT { fill: #E5484D; } .greenT { fill: #2E9E5B; } .mutedF { fill: #8A8A85; }
  </style>
  <rect class="board" x="0" y="0" width="980" height="460"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="title" x="24" y="28">self-supervision — the text is its own label</text>

  <!-- raw text stack -->
  <g transform="rotate(-1.5 110 150)">
    <rect class="box muted" x="60" y="70" width="120" height="150" rx="5"/>
    <rect class="box muted" x="52" y="78" width="120" height="150" rx="5"/>
    <rect class="box ink"   x="44" y="86" width="120" height="150" rx="5"/>
    <line class="muted" x1="58" y1="116" x2="150" y2="116" stroke-width="1"/>
    <line class="muted" x1="58" y1="136" x2="150" y2="136" stroke-width="1"/>
    <line class="muted" x1="58" y1="156" x2="150" y2="156" stroke-width="1"/>
    <line class="muted" x1="58" y1="176" x2="150" y2="176" stroke-width="1"/>
    <line class="muted" x1="58" y1="196" x2="135" y2="196" stroke-width="1"/>
  </g>
  <text class="s" x="104" y="262">raw text</text>
  <text class="note" x="104" y="282">billions of tokens,</text>
  <text class="note" x="104" y="298">NO human labels</text>

  <!-- pull one sentence -->
  <path class="flow ink" d="M178,150 C210,150 220,150 244,150" marker-end="url(#ah)"/>
  <text class="note" x="212" y="138">pull one</text>

  <!-- the split sentence: visible | hidden -->
  <rect class="box blue" x="250" y="118" width="150" height="64" rx="5"/>
  <text class="s blueT" x="325" y="142">visible part</text>
  <text class="note" x="325" y="162">(input)</text>

  <rect class="box muted" x="402" y="118" width="150" height="64" rx="5"/>
  <text class="s mutedF" x="477" y="142">hidden part</text>
  <text class="note" x="477" y="162">(withheld text)</text>
  <line class="ink" x1="401" y1="112" x2="401" y2="188" stroke-width="2.5"/>
  <text class="note" x="401" y="104">hide</text>

  <!-- visible -> model -->
  <path class="flow blue" d="M325,182 C325,230 325,250 460,250" marker-end="url(#ah)"/>
  <rect class="box ink" x="460" y="222" width="120" height="56" rx="5"/>
  <text class="h" x="520" y="256">model</text>

  <!-- hidden part -> target -->
  <path class="flow muted" d="M477,182 C477,230 560,330 600,352" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <rect class="box green" x="600" y="330" width="170" height="56" rx="5" stroke-width="3"/>
  <text class="s greenT" x="685" y="352">target / label</text>
  <text class="note" x="685" y="372">taken free from the text</text>

  <!-- model prediction -> meet target = loss -->
  <path class="flow ink" d="M580,256 C640,256 700,290 700,326" marker-end="url(#ah)"/>
  <text class="redT s" x="640" y="290">prediction</text>
  <circle class="box red" cx="700" cy="412" r="4"/>
  <text class="redT s" x="700" y="408">cross-entropy loss</text>

  <!-- banner -->
  <rect class="box green" x="60" y="408" width="500" height="40" rx="6"/>
  <text class="s greenT" x="310" y="426">the text supplies its own supervision</text>
  <text class="note" x="310" y="443">→ training scales on cheap unlabeled corpora, no annotation</text>

  <!-- contrast box -->
  <rect class="box muted" x="800" y="70" width="160" height="120" rx="6"/>
  <text class="s" x="880" y="94">classic supervised</text>
  <rect class="box ink" x="822" y="108" width="78" height="40" rx="4"/>
  <text class="s" x="861" y="132">example</text>
  <rect class="box red" x="906" y="116" width="44" height="24" rx="3"/>
  <text class="note" x="928" y="132">label</text>
  <text class="note" x="880" y="170">a human must label</text>
  <text class="note" x="880" y="186">every example</text>
</svg>
