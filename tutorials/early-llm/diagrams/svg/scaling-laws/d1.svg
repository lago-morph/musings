<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-label="The iconic scaling-law plot: test loss falls as a straight line against compute, model size, and dataset size on log-log axes; the slope is the power-law exponent.">
  <title>Scaling laws — loss is a power law in N, D, and C</title>
  <desc>Three log-log plots side by side. In each, the vertical axis is test loss on a log scale and the horizontal axis is a quantity on a log scale: training compute C, model size N, and dataset size D. In every plot the data form a descending straight line spanning several orders of magnitude, and the slope is labeled with the negative power-law exponent. A note explains that a straight line on log-log axes means loss is a power law.</desc>
  <style>
    .board { fill: #FDFCF8; }
    text { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink   { stroke: #222222; }
    .blue  { stroke: #2F6FED; }
    .red   { stroke: #E5484D; }
    .muted { stroke: #8A8A85; }
    .axis  { fill: none; stroke: #222222; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .line  { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .grid  { fill: none; stroke: #8A8A85; stroke-width: 0.8; stroke-dasharray: 3 4; }
    .title { font-size: 22px; text-anchor: middle; fill: #222222; }
    .xlbl  { font-size: 15px; text-anchor: middle; fill: #222222; }
    .ylbl  { font-size: 15px; text-anchor: middle; fill: #222222; }
    .slope { font-size: 15px; fill: #E5484D; }
    .note  { font-size: 14px; fill: #8A8A85; }
    .pt    { fill: #2F6FED; }
  </style>
  <rect class="board" x="0" y="0" width="1080" height="420"/>
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#8A8A85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="title" x="540" y="34">test loss L is a power law in each of N, D, C</text>

  <!-- ===================== PLOT 1: vs compute C ===================== -->
  <g transform="translate(40,70)">
    <!-- faint log gridlines -->
    <line class="grid" x1="40" y1="40"  x2="270" y2="40"/>
    <line class="grid" x1="40" y1="100" x2="270" y2="100"/>
    <line class="grid" x1="40" y1="160" x2="270" y2="160"/>
    <line class="grid" x1="110" y1="20" x2="110" y2="210"/>
    <line class="grid" x1="180" y1="20" x2="180" y2="210"/>
    <line class="grid" x1="250" y1="20" x2="250" y2="210"/>
    <!-- axes -->
    <path class="axis" d="M40,20 L40,210 L280,210"/>
    <!-- descending straight line spanning the width -->
    <line class="line red" x1="48" y1="48" x2="268" y2="196"/>
    <circle class="pt" cx="48"  cy="48"  r="3.4"/>
    <circle class="pt" cx="103" cy="85"  r="3.4"/>
    <circle class="pt" cx="158" cy="122" r="3.4"/>
    <circle class="pt" cx="213" cy="159" r="3.4"/>
    <circle class="pt" cx="268" cy="196" r="3.4"/>
    <!-- slope label -->
    <text class="slope" x="170" y="98">slope = −α_C</text>
    <!-- axis labels -->
    <text class="ylbl" x="20" y="120" transform="rotate(-90 20 120)">test loss L  (log)</text>
    <text class="xlbl" x="160" y="236">training compute C  (FLOPs, log)</text>
  </g>

  <!-- ===================== PLOT 2: vs model size N ===================== -->
  <g transform="translate(400,70)">
    <line class="grid" x1="40" y1="40"  x2="270" y2="40"/>
    <line class="grid" x1="40" y1="100" x2="270" y2="100"/>
    <line class="grid" x1="40" y1="160" x2="270" y2="160"/>
    <line class="grid" x1="110" y1="20" x2="110" y2="210"/>
    <line class="grid" x1="180" y1="20" x2="180" y2="210"/>
    <line class="grid" x1="250" y1="20" x2="250" y2="210"/>
    <path class="axis" d="M40,20 L40,210 L280,210"/>
    <line class="line red" x1="48" y1="54" x2="268" y2="190"/>
    <circle class="pt" cx="48"  cy="54"  r="3.4"/>
    <circle class="pt" cx="103" cy="88"  r="3.4"/>
    <circle class="pt" cx="158" cy="122" r="3.4"/>
    <circle class="pt" cx="213" cy="156" r="3.4"/>
    <circle class="pt" cx="268" cy="190" r="3.4"/>
    <text class="slope" x="170" y="100">slope = −α_N</text>
    <text class="ylbl" x="20" y="120" transform="rotate(-90 20 120)">test loss L  (log)</text>
    <text class="xlbl" x="160" y="236">model size N  (params, log)</text>
  </g>

  <!-- ===================== PLOT 3: vs dataset size D ===================== -->
  <g transform="translate(760,70)">
    <line class="grid" x1="40" y1="40"  x2="270" y2="40"/>
    <line class="grid" x1="40" y1="100" x2="270" y2="100"/>
    <line class="grid" x1="40" y1="160" x2="270" y2="160"/>
    <line class="grid" x1="110" y1="20" x2="110" y2="210"/>
    <line class="grid" x1="180" y1="20" x2="180" y2="210"/>
    <line class="grid" x1="250" y1="20" x2="250" y2="210"/>
    <path class="axis" d="M40,20 L40,210 L280,210"/>
    <line class="line red" x1="48" y1="50" x2="268" y2="192"/>
    <circle class="pt" cx="48"  cy="50"  r="3.4"/>
    <circle class="pt" cx="103" cy="85"  r="3.4"/>
    <circle class="pt" cx="158" cy="121" r="3.4"/>
    <circle class="pt" cx="213" cy="157" r="3.4"/>
    <circle class="pt" cx="268" cy="192" r="3.4"/>
    <text class="slope" x="170" y="98">slope = −α_D</text>
    <text class="ylbl" x="20" y="120" transform="rotate(-90 20 120)">test loss L  (log)</text>
    <text class="xlbl" x="160" y="236">dataset size D  (tokens, log)</text>
  </g>

  <!-- shared note with leader line to the middle plot's line -->
  <text class="note" x="300" y="392">straight on log-log axes  =  power law:</text>
  <text class="note" x="300" y="410">L ∝ x^(−α)</text>
  <path class="grid" d="M470,392 C520,360 540,300 560,238" marker-end="url(#ah1)"/>
</svg>
