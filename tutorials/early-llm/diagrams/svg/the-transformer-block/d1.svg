<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="One transformer block: input passes through multi-head self-attention then add and norm, then a position-wise feed-forward network then add and norm, with a residual skip around each sublayer.">
  <title>One transformer block — two sublayers, each wrapped in residual + LayerNorm</title>
  <desc>Top to bottom. Input X (n by d_model) feeds multi-head self-attention; its output is added to a residual copy of the input and layer-normalized. That result feeds a position-wise feed-forward network; its output is added to a residual copy and layer-normalized to give the block output (n by d_model). Each sublayer has an identity skip connection drawn around it.</desc>
  <style>
    .board { fill: #FDFCF8; }
    text { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink   { stroke: #222222; }
    .blue  { stroke: #2F6FED; }
    .red   { stroke: #E5484D; }
    .green { stroke: #2E9E5B; }
    .muted { stroke: #8A8A85; }
    .box   { fill: #FDFCF8; stroke-width: 2; stroke-linejoin: round; }
    .flow  { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .lbl   { font-size: 21px; text-anchor: middle; }
    .sub   { font-size: 16px; text-anchor: middle; }
    .dim   { font-size: 14px; text-anchor: middle; fill: #8A8A85; }
    .note  { font-size: 14px; fill: #8A8A85; }
    .title { font-size: 15px; fill: #8A8A85; }
    .blueT  { fill: #2F6FED; }
    .redT   { fill: #E5484D; }
    .greenT { fill: #2E9E5B; }
  </style>
  <rect class="board" x="0" y="0" width="640" height="720"/>
  <defs>
    <marker id="tb1ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tb1ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#8A8A85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="title" x="24" y="30">one transformer block (post-LN)</text>

  <!-- enclosure for the whole block -->
  <rect class="muted" x="150" y="60" width="300" height="600" rx="10" fill="none" stroke-dasharray="4 4" stroke-width="1.3"/>
  <text class="note" x="456" y="80">×L</text>
  <text class="note" x="456" y="98">blocks</text>

  <!-- input -->
  <text class="lbl" x="300" y="50">X</text>
  <text class="dim" x="360" y="50">n × d_model</text>

  <!-- main vertical spine -->
  <!-- input down to attention -->
  <path class="flow ink" d="M300,56 L300,108" marker-end="url(#tb1ah)"/>

  <!-- self-attention box -->
  <rect class="box blue" x="200" y="110" width="200" height="64" rx="6"/>
  <text class="sub blueT" x="300" y="138">multi-head</text>
  <text class="sub blueT" x="300" y="160">self-attention</text>

  <!-- attn -> add&norm 1 -->
  <path class="flow ink" d="M300,174 L300,224" marker-end="url(#tb1ah)"/>

  <!-- add & norm 1 -->
  <rect class="box red" x="218" y="226" width="164" height="56" rx="6"/>
  <text class="sub redT" x="300" y="252">Add &amp; Norm</text>
  <text class="dim" x="300" y="272">LayerNorm(x + sublayer)</text>

  <!-- residual skip 1 (around attention) -->
  <path class="flow green" d="M300,80 C150,80 130,150 130,254 C130,260 196,254 214,254" marker-end="url(#tb1ah)"/>
  <text class="note greenT" x="86" y="160">residual</text>
  <text class="note greenT" x="92" y="178">(skip)</text>

  <!-- add&norm1 -> ffn -->
  <path class="flow ink" d="M300,282 L300,372" marker-end="url(#tb1ah)"/>
  <text class="dim" x="360" y="332">n × d_model</text>

  <!-- FFN box -->
  <rect class="box blue" x="200" y="374" width="200" height="64" rx="6"/>
  <text class="sub blueT" x="300" y="400">position-wise</text>
  <text class="sub blueT" x="300" y="422">feed-forward (FFN)</text>

  <!-- ffn -> add&norm 2 -->
  <path class="flow ink" d="M300,438 L300,488" marker-end="url(#tb1ah)"/>

  <!-- add & norm 2 -->
  <rect class="box red" x="218" y="490" width="164" height="56" rx="6"/>
  <text class="sub redT" x="300" y="516">Add &amp; Norm</text>
  <text class="dim" x="300" y="536">LayerNorm(x + sublayer)</text>

  <!-- residual skip 2 (around ffn) -->
  <path class="flow green" d="M300,344 C150,344 130,414 130,518 C130,524 196,518 214,518" marker-end="url(#tb1ah)"/>
  <text class="note greenT" x="86" y="424">residual</text>
  <text class="note greenT" x="92" y="442">(skip)</text>

  <!-- output -->
  <path class="flow ink" d="M300,546 L300,610" marker-end="url(#tb1ah)"/>
  <text class="lbl" x="300" y="640">block output</text>
  <text class="dim" x="300" y="662">n × d_model</text>

  <!-- annotations: cross-token vs per-token -->
  <path class="flow muted" d="M408,142 L470,142" marker-end="url(#tb1ahm)" stroke-dasharray="3 3"/>
  <text class="note" x="474" y="138">mixes across</text>
  <text class="note" x="474" y="156">tokens</text>

  <path class="flow muted" d="M408,406 L470,406" marker-end="url(#tb1ahm)" stroke-dasharray="3 3"/>
  <text class="note" x="474" y="402">per-token,</text>
  <text class="note" x="474" y="420">independent</text>
</svg>
