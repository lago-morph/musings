<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-label="BPE merge process on the word 'lowest': starting from individual characters, successive most-frequent merges build subword tokens, and each merge adds a new vocabulary entry.">
  <title>BPE merge process — characters to subword tokens</title>
  <desc>Four stages left to right. Stage 0: individual characters l, o, w, e, s, t plus end-of-word marker. Stage 1: merge 'es' (most frequent pair) to form a single token. Stage 2: merge 'lo' to form a single token. Stage 3: merge 'low' (lo+w) to form the final subword tokens. Each merge step is annotated with the pair merged and the growing vocabulary list.</desc>
  <style>
    .board  { fill: #FDFCF8; }
    text    { font-family: "Comic Sans MS","Comic Neue","Patrick Hand","Segoe Print",system-ui,sans-serif; fill: #222222; }
    .ink    { stroke: #222222; }
    .blue   { stroke: #2F6FED; }
    .red    { stroke: #E5484D; }
    .green  { stroke: #2E9E5B; }
    .muted  { stroke: #8A8A85; }
    .box    { fill: #FDFCF8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .boxhi  { fill: #FDFCF8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .flow   { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .lbl    { font-size: 20px; text-anchor: middle; }
    .sm     { font-size: 14px; text-anchor: middle; }
    .smL    { font-size: 14px; text-anchor: start; }
    .dim    { font-size: 13px; text-anchor: middle; fill: #8A8A85; }
    .stageH { font-size: 15px; text-anchor: middle; fill: #8A8A85; }
    .mergeN { font-size: 13px; text-anchor: middle; fill: #E5484D; }
    .vocabT { font-size: 12px; text-anchor: start; fill: #2E9E5B; }
    .redT   { fill: #E5484D; }
    .blueT  { fill: #2F6FED; }
    .greenT { fill: #2E9E5B; }
  </style>
  <rect class="board" x="0" y="0" width="1100" height="500"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#E5484D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="stageH" x="550" y="30" font-size="16">BPE merges on the word "lowest" (toy example, left to right)</text>

  <!-- ======== STAGE 0: characters ======== -->
  <text class="stageH" x="110" y="65">Stage 0</text>
  <text class="dim"    x="110" y="82">initial: characters</text>

  <!-- char boxes at y=110, width 40 each, gap 6 -->
  <!-- l o w e s t </w> -->
  <g transform="translate(30,100)">
    <rect class="box ink" x="0"   y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="20" y="27">l</text>

    <rect class="box ink" x="46"  y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="66" y="27">o</text>

    <rect class="box ink" x="92"  y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="112" y="27">w</text>

    <rect class="box ink" x="138" y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="158" y="27">e</text>

    <rect class="box ink" x="184" y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="204" y="27">s</text>

    <rect class="box ink" x="230" y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="250" y="27">t</text>

    <rect class="box ink" x="276" y="0" width="50" height="40" rx="4"/>
    <text class="lbl" x="301" y="27" font-size="16">&lt;/w&gt;</text>
  </g>
  <text class="dim" x="185" y="165">6 chars + end marker</text>

  <!-- vocab box stage 0 -->
  <rect class="box muted" x="30" y="185" width="310" height="70" rx="6" stroke-dasharray="4 3"/>
  <text class="dim" x="185" y="202">vocab so far</text>
  <text class="vocabT" x="38" y="218">l, o, w, e, s, t, &lt;/w&gt;</text>
  <text class="dim" x="185" y="248">size = 7</text>

  <!-- ======== Arrow stage 0→1 ======== -->
  <path class="flow ink" d="M360,140 L415,140" marker-end="url(#ah)"/>
  <text class="mergeN" x="387" y="128">merge 1</text>
  <text class="mergeN" x="387" y="145" font-size="12">"e"+"s" → "es"</text>
  <text class="dim"    x="387" y="162" font-size="12">(most frequent pair)</text>

  <!-- ======== STAGE 1: es merged ======== -->
  <text class="stageH" x="570" y="65">Stage 1</text>
  <text class="dim"    x="570" y="82">after merge 1</text>

  <g transform="translate(420,100)">
    <rect class="box ink" x="0"   y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="20" y="27">l</text>

    <rect class="box ink" x="46"  y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="66" y="27">o</text>

    <rect class="box ink" x="92"  y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="112" y="27">w</text>

    <!-- es merged: highlighted in red -->
    <rect class="boxhi red" x="138" y="-4" width="56" height="48" rx="4"/>
    <text class="lbl redT" x="166" y="27">es</text>

    <rect class="box ink" x="200" y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="220" y="27">t</text>

    <rect class="box ink" x="246" y="0" width="50" height="40" rx="4"/>
    <text class="lbl" x="271" y="27" font-size="16">&lt;/w&gt;</text>
  </g>
  <text class="dim" x="570" y="165">5 tokens now</text>

  <rect class="box muted" x="420" y="185" width="310" height="70" rx="6" stroke-dasharray="4 3"/>
  <text class="dim" x="575" y="202">vocab so far</text>
  <text class="vocabT" x="428" y="218">l, o, w, e, s, t, &lt;/w&gt;, <tspan fill="#E5484D">es</tspan></text>
  <text class="dim" x="575" y="248">size = 8</text>

  <!-- ======== Arrow stage 1→2 ======== -->
  <path class="flow ink" d="M748,140 L803,140" marker-end="url(#ah)"/>
  <text class="mergeN" x="775" y="128">merge 2</text>
  <text class="mergeN" x="775" y="145" font-size="12">"l"+"o" → "lo"</text>

  <!-- ======== STAGE 2: lo merged ======== -->
  <text class="stageH" x="940" y="65">Stage 2</text>
  <text class="dim"    x="940" y="82">after merge 2</text>

  <g transform="translate(808,100)">
    <!-- lo merged: highlighted in blue -->
    <rect class="boxhi blue" x="0"  y="-4" width="56" height="48" rx="4"/>
    <text class="lbl blueT" x="28" y="27">lo</text>

    <rect class="box ink" x="62"  y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="82" y="27">w</text>

    <rect class="boxhi red" x="108" y="-4" width="56" height="48" rx="4"/>
    <text class="lbl redT" x="136" y="27">es</text>

    <rect class="box ink" x="170" y="0" width="40" height="40" rx="4"/>
    <text class="lbl" x="190" y="27">t</text>

    <rect class="box ink" x="216" y="0" width="50" height="40" rx="4"/>
    <text class="lbl" x="241" y="27" font-size="16">&lt;/w&gt;</text>
  </g>
  <text class="dim" x="940" y="165">4 tokens now</text>

  <rect class="box muted" x="808" y="185" width="280" height="70" rx="6" stroke-dasharray="4 3"/>
  <text class="dim" x="948" y="202">vocab so far</text>
  <text class="vocabT" x="816" y="218">…, <tspan fill="#E5484D">es</tspan>, <tspan fill="#2F6FED">lo</tspan></text>
  <text class="dim" x="948" y="248">size = 9</text>

  <!-- ======== STAGE 3 label: next merge would be lo+w → low ======== -->
  <!-- Bottom annotation strip -->
  <line class="muted" x1="30" y1="285" x2="1070" y2="285" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="dim" x="550" y="310" font-size="13">Each merge adds one entry to the vocabulary. Stop when vocab reaches target size V.</text>
  <text class="dim" x="550" y="330" font-size="13">Next merge: "lo" + "w" → "low" (size = 10); then "low" + "est" → "lowest" if it keeps appearing.</text>
  <text class="dim" x="550" y="350" font-size="12">Subword tokens inherit morpheme-like structure statistically — not by linguistic rule.</text>

  <!-- arrow showing merge rule box -->
  <rect class="box ink" x="30" y="370" width="500" height="100" rx="6"/>
  <text class="sm" x="280" y="393" font-size="14">BPE merge rule (Sennrich, Haddow &amp; Birch 2016):</text>
  <text class="smL" x="44" y="415" font-size="13">1. Count all adjacent token pairs in the corpus.</text>
  <text class="smL" x="44" y="435" font-size="13">2. Find the most frequent pair; create a new merged token.</text>
  <text class="smL" x="44" y="455" font-size="13">3. Replace all occurrences of that pair. Repeat until vocab size = V.</text>

  <!-- right annotation: vocab size vs sequence length trade-off -->
  <rect class="box green" x="570" y="370" width="500" height="100" rx="6"/>
  <text class="sm greenT" x="820" y="393" font-size="14">Trade-off:</text>
  <text class="smL" x="584" y="415" font-size="13">↑ V (larger vocab) → fewer tokens per sentence, but more parameters.</text>
  <text class="smL" x="584" y="435" font-size="13">↓ V (smaller vocab) → longer sequences, slower training.</text>
  <text class="smL" x="584" y="455" font-size="13">Typical V ≈ 30 000 – 50 000 for modern subword models.</text>
</svg>
